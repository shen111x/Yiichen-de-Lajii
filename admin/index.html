<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yiichen de Lajii Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <button class="brand-lockup" type="button" data-view="home" aria-label="Go to dashboard home">
          <img class="brand-logo" src="images/logoa-black.png" alt="Yiichen de Lajii">
          <span class="brand-subtitle">Admin Dash by Yiichen Shen</span>
          <span class="server-status" id="admin-server-status">
            <span class="server-status-light" aria-hidden="true"></span>
            <span class="server-status-text">Admin server: checking...</span>
          </span>
        </button>

        <div class="admin-actions">
          <button class="admin-button save-button" type="button">Save</button>
        </div>
      </div>

      <nav class="admin-functions" aria-label="Admin functions">
        <button class="admin-button" type="button" data-view="order-status">Order Status</button>
        <button class="admin-button" type="button" data-view="product-management">Product Management</button>
        <button class="admin-button" id="generate-product-json" type="button" data-view="generate-product-json">Generate Product Jsons</button>
        <button class="admin-button" id="launch-delajii-terminal" type="button" data-view="tba">deLajii Terminal</button>
      </nav>
    </header>

    <section class="admin-display" id="admin-display" aria-live="polite"></section>

    <template id="order-status-template">
      <div class="iframe-box">
        <iframe
          src="https://docs.google.com/spreadsheets/d/1jLnb_X71sXKPCuw1mJNUd9Dcm-Ac-QNQjMHsK0RpTwA/edit?usp=sharing"
        ></iframe>
      </div>
    </template>
  </main>

  <script src="js/generate-product-json.js?v=20260703-8"></script>
  <script src="js/launch-delajii-terminal.js?v=1"></script>
</body>
</html>
