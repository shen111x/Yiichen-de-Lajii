<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>Yiichen de Lajii</title>

  <script>document.documentElement.classList.add('is-data-loading');</script>
  <link rel="stylesheet" href="../../css/universal.css">

  <style>
    .is-data-loading .category-body-main {
      visibility: hidden;
    }

    .category-body-main {
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
      padding: calc(var(--header-topbar-height) + var(--gap-unit) * 3) calc(var(--gap-unit) * 3) calc(var(--gap-unit) * 3);
      background: transparent;
    }

    .category-page {
      width: 100%;
      min-height: 100vh;
    }

    .category-hero {
      width: 100%;
      height: 40vh;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .category-hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--gap-unit) * 1.5);
      text-align: center;
    }

    .category-title {
      margin: 0;
    }

    .category-sort {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: calc(var(--gap-unit) * 0.75) calc(var(--gap-unit) * 5) calc(var(--gap-unit) * 0.75) calc(var(--gap-unit) * 2);
      width:115px;
      min-height: calc(var(--header-topbar-height) * 1);
      box-sizing: border-box;
      border: var(--stroke--width) solid #ffffff;
      border-radius: 0;
      background: transparent;
      color: #000;
      font: inherit;
      font-size: var(--product-info-font-size);
      line-height: normal;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
    }

    .category-sort-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .category-sort-wrapper::after {
      content: "";
      position: absolute;
      right: calc(var(--gap-unit) * 2);
      top: 50%;
      width: 0.45em;
      height: 0.45em;
      border-right: var(--stroke--width) solid #000;
      border-bottom: var(--stroke--width) solid #000;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .category-products {
      width: min(100%, 920px);
      box-sizing: border-box;
      margin: 0 auto;
      padding: calc(var(--gap-unit) * 3) 0 calc(var(--gap-unit) * 20);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: calc(var(--gap-unit) * 4);
      row-gap: calc(var(--gap-unit) * 20);
    }

    .category-product-item,
    .category-product-link {
      min-width: 0;
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--gap-unit) * 2);
    }

    .category-product-link {
      width: 100%;
    }

    .category-product-text-link {
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .category-products.is-sizebox-open .category-product-item:not(.is-sizebox-active) .category-product-link,
    .category-products.is-sizebox-open .category-product-item:not(.is-sizebox-active) .category-product-text-link {
      pointer-events: none;
    }

    .category-product-image-wrapper {
      width: 100%;
      aspect-ratio: 4 / 5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .category-product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .category-product-image.is-missing {
      display: none;
    }

    .category-product-info {
      position: relative;
      min-height: calc(var(--header-topbar-height) * 2.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      font-size: var(--product-info-font-size);
    }

    .category-product-info p {
      margin: 0;
    }

    .category-product-name {
      -webkit-text-stroke: 0.02em #000;
      width:70%;
    }

    .category-product-subtitle {
      opacity: 0.32;
      display:none;
    }

    .category-product-price {
      margin-top: calc(var(--gap-unit) * 2) !important;
      opacity:0.32;
    }

    .category-product-button-box {
      position: relative;
      width: 100%;
      margin-top: calc(var(--gap-unit) * 2);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: visible;
      font-size: var(--product-info-font-size);
    }

    .category-product-add {
      position: relative;
      z-index: 2;
      padding: 0;
      width: min(132px, 40%);
      height: calc(var(--header-topbar-height) * 1);
      box-sizing: border-box;
      border: var(--stroke--width) solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: var(--product-info-font-size);
      color: #000;
      cursor: pointer;
      line-height: 1;
      transition: opacity .25s ease;
    }

    .category-product-add:hover,
    .category-product-size-item:hover {
      border-bottom: var(--stroke--width) solid transparent;
      text-decoration: underline;
    }

    .category-product-add.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .category-product-size-box {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 1;
      width: max-content;
      min-width: min(132px, 40%);
      max-width: min(180px, 72vw);
      box-sizing: border-box;
      padding: calc(var(--gap-unit) * 2) calc(var(--gap-unit) * 3) calc(var(--gap-unit) * 3);
      border: var(--stroke--width) solid #000;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(.55);
      transform-origin: top center;
      transition: opacity .25s ease, transform .25s ease;
    }

    .category-product-size-box.is-open {
      z-index: 5;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .category-product-size-top {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(var(--gap-unit) * 2);
    }

    .category-product-size-close {
      margin: 0;
      padding: 0;
      border: 0;
      border-bottom: var(--stroke--width) solid transparent;
      background: none;
      color: #000;
      font: inherit;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }

    .category-product-size-close:hover {
      border-bottom-color: #000;
    }

    .category-product-size-close-icon {
      width: 1em;
      height: 1em;
      display: block;
    }

    .category-product-size-item {
      margin: 0;
      padding: 0 0 calc(var(--stroke--width) * 0.65);
      border: 0;
      border-bottom: var(--stroke--width) solid transparent;
      background: none;
      color: #000;
      font: inherit;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .category-product-size-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--gap-unit) * 2) calc(var(--gap-unit) * 2.5);
      max-width: 100px;
    }

    .category-empty {
      grid-column: 1 / -1;
      min-height: 30vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: var(--product-info-font-size);
    }

    .category-body-copyright-container {
      margin-top: calc(var(--gap-unit) * 8);
    }

    @media (max-width: 767px) {
      .category-body-main {
        padding-left: calc(var(--gap-unit) * 2);
        padding-right: calc(var(--gap-unit) * 2);
      }

      .category-hero {
        min-height: 360px;
      }

      .category-products {
        column-gap: calc(var(--gap-unit) * 2);
        row-gap: calc(var(--gap-unit) * 12);
      }

      .category-sort {
        min-width: 132px;
      }
    }
  </style>
</head>

<body data-page="category">
  <header id="header-container"></header>

  <main class="category-body-main">
    <div class="category-page">
      <section class="category-hero" aria-labelledby="category-title">
        <div class="category-hero-center">
          <h1 id="category-title" class="category-title">Wearable</h1>
          <div class="category-sort-wrapper">
            <select id="category-sort" class="category-sort" aria-label="Sort products">
              <option value="default">Default</option>
              <option value="price-asc">Price ↑</option>
              <option value="price-desc">Price ↓</option>
              <option value="oddness-asc">Oddness ↑</option>
              <option value="oddness-desc">Oddness ↓</option>
            </select>
          </div>
        </div>
      </section>

      <section id="category-products" class="category-products" aria-label="Products">
        <div id="category-product-unit" class="category-product-item" hidden>
          <a class="category-product-link" href="../product/index.html?c=01&p=01&product=example-product&item=01">
            <div class="category-product-image-wrapper">
              <img class="category-product-image" src="../../product-data/c-01/01/images/1.jpg" alt="Product name">
            </div>
          </a>

          <div class="category-product-info">
            <a class="category-product-text-link" href="../product/index.html?c=01&p=01&product=example-product&item=01">
              <p class="category-product-name">Product Name</p>
              <p class="category-product-subtitle">Product Subtitle</p>
              <p class="category-product-price">173.43 usd</p>
            </a>
            <div class="category-product-button-box">
              <button class="category-product-add" type="button">Add +</button>
              <div class="category-product-size-box" aria-hidden="true">
                <div class="category-product-size-top">
                  <button class="category-product-size-close" type="button" aria-label="Close sizes">
                    <img class="category-product-size-close-icon" src="../../images/icon/xicon.svg" alt="">
                  </button>
                </div>
                <div class="category-product-size-bottom"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="copyright-container" class="category-body-copyright-container"></div>
  </main>

  <script src="../../js/universal.js"></script>
  <script src="category.js"></script>
</body>
</html>
