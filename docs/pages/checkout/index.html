<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Checkout - Yiichen de Lajii</title>

  <link rel="stylesheet" href="../../css/universal.css">

  <style>
    .checkout-body-topbar {
      position: fixed;
      top: calc(var(--header-topbar-height) + var(--gap-unit) * 6);
      left: 0;
      z-index: 9;

      width: 100%;
      height: var(--header-topbar-height);
      box-sizing: border-box;
      padding: 0 calc(var(--gap-unit) * 3);
      overscroll-behavior: none;
      touch-action: pan-x;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--gap-unit) * 3);

      font-size: var(--product-info-font-size);
    }

    .checkout-body-topbar-left {
      width: calc(var(--header-topbar-height) * 7.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0px;
      min-width: 0;

    }

    .checkout-body-topbar-left-name-wrapper,
    .checkout-body-topbar-left-price-wrapper {
      min-width: 0;
      flex: 0 1 auto;
      display: flex;
      flex-direction: column;
    }

    .checkout-body-topbar-left-name-wrapper {
      align-items: flex-start;
      width: max-content;
      max-width: 100%;
      margin-left: 5px;
    }

    .checkout-body-topbar-left-price-wrapper {
      align-items: stretch;
      width: max-content;
    }

    .checkout-body-topbar-left-name-wrapper p,
    .checkout-body-topbar-left-price-wrapper p,
    .checkout-body-topbar-right p {
      margin: 0;
    }

    .checkout-body-topbar-price-line {
      display: flex;
      justify-content: flex-end;
      gap: 0.35em;
      white-space: nowrap;
    }

    .checkout-body-topbar-tax-line {
      justify-content: space-between;
    }

    .checkout-body-topbar-subline {
      color: rgba(0, 0, 0, 0.22);
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
    }

    .checkout-stripe-icon {
      width: auto;
      height: 1.05em;
      padding-top:0.3em;
      opacity: 0.22;
      display: inline-block;
    }

    .checkout-body-topbar-right {
      position: relative;
      flex: 1;
      max-width: 150px;
      margin-right: clamp(0px, calc(4vw + 1vw - 16px), calc(var(--gap-unit) * 3));

      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .checkout-body-topbar-right-total {
      position: relative;
      align-self: flex-start;
      width: 61%;
      height: 100%;
      box-sizing: border-box;
      padding: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      white-space: nowrap;
    }

    .checkout-body-topbar-total-label,
    .checkout-body-topbar-total-value {
      display: flex;
      justify-content: flex-end;
      gap: 0.35em;
    }

    .checkout-body-main {
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
      padding: calc(var(--gap-unit) * 1.5);
    
      padding-top:max(17vh, calc(var(--header-topbar-height) * 2 + var(--gap-unit) * 12));
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .checkout-body-main-inner {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: calc(var(--gap-unit) * 1.5);
    }

    .checkout-container {
      box-sizing: border-box;
      width: 100%;
      padding: calc(var(--gap-unit) * 1.5);
      border: var(--stroke--width) solid #000;
      font-size: var(--product-info-font-size);
      -webkit-text-stroke: 0.02em currentColor;
    }

    .checkout-section-title-row {
      min-height: var(--header-topbar-height);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: calc(var(--gap-unit) * 3);
      text-transform: uppercase;
    }

    .checkout-field-stack {
      display: flex;
      flex-direction: column;
    
    }

    .checkout-field {
      min-height: calc(var(--header-topbar-height) * 1);
      display: flex;
      align-items: flex-end;
      border-bottom: var(--stroke--width) solid #000;
      box-sizing: border-box;
    }

    .checkout-field-inner {
      width: 100%;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
    }

    .checkout-field label,
    .checkout-field input {
      display: block;
      margin: 0;
      padding-top: 0;
      padding-bottom: 0;
      font: inherit;
      line-height: 1;
      -webkit-text-stroke: inherit;
    }

    .checkout-field input {
      width: calc(100% / 0.75);
      min-width: 0;
      height: auto;
      box-sizing: border-box;
      padding-left:1em;

      font-size: var(--base-font-size);
      transform: scale(0.75);
      transform-origin: left center;
      vertical-align: bottom;
      border: 0;
      outline: 0;
      background: transparent;
      color: #000;
      appearance: none;
      -webkit-appearance: none;
    }


    .checkout-field label {
      flex: none;
    }

    .checkout-field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: calc(var(--gap-unit) * 6);
    }

    .checkout-policy {
      margin-top: 0;
      color: rgba(0, 0, 0, 0.22);
      -webkit-text-stroke: 0.02em currentColor;
    }

    .checkout-policy p {
      margin: 0;
      font-size: inherit;
    }

    .checkout-promo {
      margin-top: var(--header-topbar-height);
    }

    .checkout-promo-row {
      min-height: var(--header-topbar-height);
      display: flex;
      align-items: flex-end;
      border-bottom: var(--stroke--width) solid #000;
      box-sizing: border-box;
    }

    .checkout-promo-row label,
    .checkout-promo-row input,
    .checkout-promo-row button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      -webkit-text-stroke: inherit;
    }

    .checkout-promo-row input {
      width: 9em;
      min-width: 4em;
      flex: 0 1 9em;
      padding-left: 1em;
      outline: 0;
    }

    .checkout-promo-description {
      color: rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .checkout-promo-row button[disabled] {
      cursor: default;
      opacity: 0.35;
    }

    .checkout-promo-row button {
      margin-left: auto;
      cursor: pointer;
    }

    .checkout-billing-toggle {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--gap-unit) * 2);
      text-transform: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .checkout-billing-toggle input {
      width: 0.9em;
      height: 0.9em;
      margin: 0;
      accent-color: #000;
    }

    .checkout-billing-address {
      display: none;
      margin-bottom: var(--header-topbar-height);
    }

    .checkout-billing-address.is-open {
      display: flex;
    }

    .checkout-card-line {
      min-height: var(--header-topbar-height);
      display: flex;
      align-items: flex-end;
      border-bottom: var(--stroke--width) solid #000;
      box-sizing: border-box;
    }

    #card-element {
      width: 100%;
      padding-bottom: calc(var(--gap-unit) * 1.25);
    }

    .checkout-express-select-div {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      row-gap: calc(var(--gap-unit) * 5);
      padding: calc(var(--gap-unit) * 8) calc(var(--gap-unit) * 1.5);
      font-size: var(--product-info-font-size);
      -webkit-text-stroke: 0.02em currentColor;
    }

    .checkout-express-button {
      flex: 0 0 25%;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
      margin: 0;
      padding: 0 0 calc(var(--stroke--width) * 0.65);
      border: 0;
      background: transparent;
      color: #000;
      font: inherit;
      -webkit-text-stroke: inherit;
      cursor: pointer;
      text-decoration: none;
      text-decoration-thickness: var(--text-underline-thickness);
      text-underline-offset: var(--text-underline-offset);
    }

    .checkout-express-button.is-selected {
      text-decoration: underline;
    }

    .checkout-express-button[hidden] {
      display: none;
    }

    .checkout-submit-stack {
      position: relative;
      width: 100%;
      min-height: var(--header-topbar-height);
    }

    .checkout-button {
      width: 100%;
      height: var(--header-topbar-height);
      border: 0;
      background: #000;
      color: #fff;
      font: inherit;
      -webkit-text-stroke: 0.02em currentColor;
      cursor: pointer;
      border-radius: 0;
      padding-bottom: 0.25em;
    }

    .checkout-button.is-revealing {
      animation: checkout-button-reveal 1s ease-out both;
    }

    @keyframes checkout-button-reveal {
      0%,
      50% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .checkout-button:hover {
      text-decoration: underline;
    }

    .checkout-button[disabled] {
      cursor: default;
      opacity: 0.35;
      text-decoration: none;
    }

    #express-checkout-wrapper {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: var(--header-topbar-height);
      height: var(--header-topbar-height);
    }

    #express-checkout-wrapper.is-open {
      display: flex;
    }

    #express-checkout-element {
      width: calc(100% / 0.875);
      height: 40px;
      flex: none;
      transform: scale(0.875);
      transform-origin: center center;
    }

    #payment-message {
      position: absolute;
      top: calc(var(--header-topbar-height) + var(--gap-unit) * 1.5);
      left: 0;
      width: 100%;
      font-size: var(--product-info-font-size);
      text-align: center;
      color: #ba0000;
      -webkit-text-stroke: 0.02em currentColor;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #payment-message.is-open {
      opacity: 1;
      visibility: visible;
    }

    #checkout-status {
      min-height: var(--header-topbar-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--product-info-font-size);
      color: rgba(0, 0, 0, 0.35);
      -webkit-text-stroke: 0.02em currentColor;
    }

    #express-checkout-detector {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .checkout-copyright-container {
      margin-top: auto;
      padding-top: calc(var(--gap-unit) * 8);
      font-size: var(--product-info-font-size);
      -webkit-text-stroke: 0.02em currentColor;
    }

    @media (max-width: 767px) {
      .checkout-field-row {
        gap: calc(var(--gap-unit) * 3);
      }

      .checkout-billing-toggle {
        white-space: normal;
        justify-content: flex-end;
        text-align: right;
      }

    }
  </style>
</head>

<body>
  <header id="header-container"></header>

  <div class="checkout-body-topbar">
    <div class="checkout-body-topbar-left">
      <div class="checkout-body-topbar-left-name-wrapper">
        <p>Checkout Terminal</p>
        <p class="checkout-body-topbar-subline">
          <span>Secured by</span>
          <img id="checkout-stripe-icon" class="checkout-stripe-icon" src="../../images/icon/stripe-logo.svg" alt="Stripe">
        </p>
      </div>

      <div class="checkout-body-topbar-left-price-wrapper">
        <p class="checkout-body-topbar-price-line"><span id="checkout-subtotal">0.00</span><span>order</span></p>
        <p class="checkout-body-topbar-price-line checkout-body-topbar-tax-line"><span>+</span><span><span id="checkout-tax">0.00</span> tax</span></p>
      </div>
    </div>

    <div class="checkout-body-topbar-right">
      <div class="checkout-body-topbar-right-total">
        <p id="checkout-total-label" class="checkout-body-topbar-total-label"><span>=</span><span>TOTAL:</span></p>
        <p class="checkout-body-topbar-total-value"><span id="checkout-total">0.00</span><span id="checkout-currency">usd</span></p>
      </div>
    </div>
  </div>

  <main class="checkout-body-main">
    <div class="checkout-body-main-inner">
      <section class="checkout-container" aria-labelledby="checkout-shipping-title">
        <div class="checkout-section-title-row" id="checkout-shipping-title">Shipping</div>
        <div class="checkout-field-stack">
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="shipping-name">Name:</label>
              <input id="shipping-name" name="shipping_name" autocomplete="shipping name">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="shipping-email">Email:</label>
              <input id="shipping-email" name="email" type="email" autocomplete="email">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="shipping-phone">Number:</label>
              <input id="shipping-phone" name="phone" type="tel" autocomplete="tel">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="shipping-address-1">Address:</label>
              <input id="shipping-address-1" name="address_1" autocomplete="shipping address-line1">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="shipping-address-2">Address+:</label>
              <input id="shipping-address-2" name="address_2" autocomplete="shipping address-line2">
            </div>
          </div>
          <div class="checkout-field-row">
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="shipping-country">Country:</label>
                <input id="shipping-country" name="country" autocomplete="shipping country" maxlength="2" pattern="[A-Za-z]{2}" title="Use a two-letter country code, such as US.">
              </div>
            </div>
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="shipping-state">State:</label>
                <input id="shipping-state" name="state" autocomplete="shipping address-level1">
              </div>
            </div>
          </div>
          <div class="checkout-field-row">
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="shipping-city">City:</label>
                <input id="shipping-city" name="city" autocomplete="shipping address-level2">
              </div>
            </div>
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="shipping-postal-code">Zip:</label>
                <input id="shipping-postal-code" name="postal_code" autocomplete="shipping postal-code" maxlength="12" pattern="[A-Za-z0-9][A-Za-z0-9 -]{1,10}[A-Za-z0-9]" title="Enter a valid ZIP or postal code.">
              </div>
            </div>
          </div>
        </div>
        <div class="checkout-policy">
          <p>Shipping Policy:</p>
          <p>Most our product ships within 7 days, trasit time depends on the destination and carrer.</p>
        </div>
        <div class="checkout-promo">
          <div class="checkout-promo-row">
            <label for="promo-code">Promo Code:</label>
            <input id="promo-code" name="promo_code" autocomplete="off">
            <span id="promo-description" class="checkout-promo-description"></span>
            <button id="promo-apply" type="button">apply</button>
          </div>
        </div>
      </section>

      <section class="checkout-container" aria-labelledby="checkout-billing-title">
        <div class="checkout-section-title-row">
          <span id="checkout-billing-title">Billing</span>
          <label class="checkout-billing-toggle">
            <input id="billing-same-as-shipping" type="checkbox" checked>
            <span>Billing info same as shipping info</span>
          </label>
        </div>

        <div id="billing-address-fields" class="checkout-field-stack checkout-billing-address" aria-hidden="true">
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="billing-name">Name:</label>
              <input id="billing-name" name="billing_name" autocomplete="billing name">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="billing-address-1">Address:</label>
              <input id="billing-address-1" name="billing_address_1" autocomplete="billing address-line1">
            </div>
          </div>
          <div class="checkout-field">
            <div class="checkout-field-inner">
              <label for="billing-address-2">Address+:</label>
              <input id="billing-address-2" name="billing_address_2" autocomplete="billing address-line2">
            </div>
          </div>
          <div class="checkout-field-row">
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="billing-country">Country:</label>
                <input id="billing-country" name="billing_country" autocomplete="billing country">
              </div>
            </div>
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="billing-state">State:</label>
                <input id="billing-state" name="billing_state" autocomplete="billing address-level1">
              </div>
            </div>
          </div>
          <div class="checkout-field-row">
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="billing-city">City:</label>
                <input id="billing-city" name="billing_city" autocomplete="billing address-level2">
              </div>
            </div>
            <div class="checkout-field">
              <div class="checkout-field-inner">
                <label for="billing-postal-code">Zip:</label>
                <input id="billing-postal-code" name="billing_postal_code" autocomplete="billing postal-code">
              </div>
            </div>
          </div>
        </div>

        <div class="checkout-card-line">
          <div id="card-element"></div>
        </div>
      </section>

      <div id="express-selector" class="checkout-express-select-div" aria-label="Payment method"></div>

      <form id="payment-form" class="checkout-submit-stack">
        <button id="payment-submit" class="checkout-button" type="submit">Pay by Card</button>
        <div id="express-checkout-wrapper">
          <div id="express-checkout-element"></div>
        </div>
        <div id="payment-message" role="alert" aria-live="polite"></div>
      </form>

      <div id="checkout-status" role="status">Loading checkout...</div>
      <div id="express-checkout-detector"></div>
    </div>
    <div id="copyright-container" class="checkout-copyright-container"></div>
  </main>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="../../js/universal.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
