<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yiichen de Lajii</title>

  <link rel="stylesheet" href="../../css/universal.css">

  <style>
    .product-body-main {
      position: relative;
      width: 100vw;
      height: max-content;
      box-sizing: border-box;
      padding: 0 calc(var(--gap-unit) * 3) calc(var(--gap-unit) * 3);
      margin-top:calc(var(--header-topbar-height) * 2 + var(--gap-unit) * 9);

      background: #ffffff;
    }

    .product-body-topbar {
      position: fixed;
      top: calc(var(--header-topbar-height) + var(--gap-unit) *6);
      left: 0;
      z-index: 9;

      width: 100%;
      height: var(--header-topbar-height);
      box-sizing: border-box;
      padding: 0 calc(var(--gap-unit) * 3);
      overscroll-behavior: none;
      touch-action: pan-x;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--gap-unit) * 3);

      font-size: var(--product-info-font-size);
    }

    .product-body-topbar-left {
      width: calc(var(--header-topbar-height) * 7.2);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 66px;
      min-width: 0;
    }

    .product-body-topbar-left-name-wrapper,
    .product-body-topbar-left-price-wrapper {
      min-width: 0;
      flex: 0 1 auto;
      display: flex;
      flex-direction: column;
    }

    .product-body-topbar-left-name-wrapper {
      align-items: flex-start;
      width: max-content;
      max-width: 100%;
      margin-left:5px;
    }

    .product-body-topbar-left-price-wrapper {
      align-items: flex-end;
      width: max-content;
    }

    .product-body-topbar-left-name-wrapper p,
    .product-body-topbar-left-price-wrapper p {
      margin: 0;

    
      
      text-align: center;
    }

    .product-body-topbar-right {
      position: relative;
      flex: 1;
      max-width: 150px;
      margin-right:clamp(0px, calc(4vw + 1vw - 16px), calc(var(--gap-unit) * 3));

      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .product-body-topbar-right-add-to-cart {
      position: relative;
      align-self: flex-start;
      width: 61%;
      height: 100%;
      box-sizing: border-box;
      padding: 0;

      display: block;
      overflow: hidden;

      border: var(--stroke--width) solid #000;
      font-size: var(--product-info-font-size);
      font-family: inherit;
      line-height: 1;
      -webkit-text-stroke: 0.01em #000;
      transition: height .25s ease;

      filter:brightness(0.97);
    }

    .product-body-add-button {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      line-height: 1;
      -webkit-text-stroke: inherit;
      cursor: pointer;
    }

    .product-body-add-button:hover {
      text-decoration: underline;
    }

    .product-body-topbar-right-add-to-cart.is-open .product-body-add-button {
      display: none;
    }

    .product-body-size-box {
      display: none;
      width: 100%;
      box-sizing: border-box;
      padding: calc(var(--gap-unit) * 2) 0 calc(var(--gap-unit) * 3);
    }

    .product-body-topbar-right-add-to-cart.is-open .product-body-size-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-body-size-top {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(var(--gap-unit) * 2);
    }

    .product-body-size-close {
      margin: 0;
      padding: 0;
      border: 0;
      border-bottom: var(--stroke--width) solid transparent;
      background: none;
      color: #000;
      font: inherit;
      line-height: 1;
      -webkit-text-stroke: inherit;
      cursor: pointer;
      user-select: none;
    }

    .product-body-size-close:hover {
      border-bottom-color: #000;
    }

    .product-body-size-close-icon {
      width: 1em;
      height: 1em;
      display: block;
    }

    .product-body-size-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--gap-unit) * 2);
    }

    .product-body-size-item {
      margin: 0;
      padding: 0 0 calc(var(--stroke--width) * 0.65);
      border: 0;
      border-bottom: var(--stroke--width) solid transparent;
      background: none;
      color: #000;
      font: inherit;
      line-height: 1;
      -webkit-text-stroke: 0.01em #000;
      cursor: pointer;
      user-select: none;
    }

    .product-body-size-item:hover {
      border-bottom-color: #000;
    }

    .product-body-goback {
      position: absolute;
      top: calc(var(--header-topbar-height) * 2 + var(--gap-unit) * 9);
      left: calc(var(--gap-unit) * 3);
      z-index: 2;

      width: var(--header-topbar-height);
      height: var(--header-topbar-height);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .product-body-goback img {
      width: 55%;
      height: auto;
      display: block;
    }

    .product-body-img-wrapper {
      width: 100vw;
      margin-left: calc(var(--gap-unit) * -3);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: auto;
      -webkit-overflow-scrolling: auto;
      scrollbar-width: none;
    }

    .product-body-img-wrapper::-webkit-scrollbar {
      display: none;
    }

    .product-body-img-track {
      position: relative;
      display: flex;
      align-items: center;
      gap: calc(var(--gap-unit) * 6);
      width: max-content;
      padding: 0 calc(var(--gap-unit) * 6);
    }

    .product-body-img-group {
      display: flex;
      align-items: center;
      gap: calc(var(--gap-unit) * 6);
      flex: none;
    }

    .product-body-img-cell {
      width: max-content;
      min-width: 50vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .product-body-img-wrapper img {
      width: auto;
      height: auto;
      max-width: 130vw;
      max-height: 70vh;
      display: block;
      flex: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .product-body-dropdown-section {
      margin-top: calc(var(--header-topbar-height) + var(--gap-unit) * 3);
    }

    .product-body-dropdown {
      border-top: var(--stroke--width) solid #000;
      pointer-events: auto;
    }

    .product-body-dropdown:last-child {
      border-bottom: var(--stroke--width) solid #000;
    }

    .product-body-dropdown-summary {
      min-height: var(--header-topbar-height);
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      padding: 0;

      cursor: pointer;
      list-style: none;
      pointer-events: auto;
      font-size: var(--button-font-size);
    }

    .product-body-dropdown-summary::-webkit-details-marker {
      display: none;
    }

    .product-body-dropdown-icon {
      flex: none;
      position: relative;
      width: 0.72em;
      height: 0.72em;
    }

    .product-body-dropdown-icon::before,
    .product-body-dropdown-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: #000;
      transform: translate(-50%, -50%);
    }

    .product-body-dropdown-icon::before {
      width: 100%;
      height: calc(var(--stroke--width) * 0.72);
    }

    .product-body-dropdown-icon::after {
      width: calc(var(--stroke--width) * 0.72);
      height: 100%;
      transition: opacity .28s ease;
    }

    .product-body-dropdown[open] .product-body-dropdown-icon::after {
      opacity: 0;
    }

    .product-body-dropdown-content {
      box-sizing: border-box;
      height: 0;
      overflow: hidden;
      transition: height .28s ease;
    }

    .product-body-dropdown-content-inner {
      overflow: hidden;
    }

    .product-body-dropdown-content-inner p {
      padding: calc(var(--gap-unit) * 6) calc(var(--gap-unit) * 3) calc(var(--gap-unit) * 8);
    }

    .product-body-dropdown-content p {
      margin: 0;
      font-size: var(--product-info-font-size);
      white-space: pre-line;
      
    }

    .product-body-copyright-container {
      margin-top: calc(var(--header-topbar-height) * 3);
    }
  </style>
</head>

<body data-page="wearable">
  <header id="header-container"></header>

  <div class="product-body-topbar">
    <div class="product-body-topbar-left">
      <div class="product-body-topbar-left-name-wrapper">
        <p id="product-name"><!-- Typography Flag Tee R.O.C. --></p>
      </div>

      <div class="product-body-topbar-left-price-wrapper">
        <p id="product-price"><!-- 127.43 usd --></p>
      </div>
    </div>

    <div class="product-body-topbar-right">
      <div id="product-add-button" class="product-body-topbar-right-add-to-cart">
        <button class="product-body-add-button" type="button">Add</button>
        <div class="product-body-size-box" aria-hidden="true">
          <div class="product-body-size-top">
            <button class="product-body-size-close" type="button" aria-label="Close sizes">
              <img class="product-body-size-close-icon" src="../../images/icon/xicon.svg" alt="">
            </button>
          </div>
          <div class="product-body-size-bottom"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="product-body-main">
    <div class="product-body-goback">
      <img src="../../images/icon/goback.svg" alt="goback-icon">
    </div>

    <div id="product-gallery" class="product-body-img-wrapper">
      <div id="product-gallery-track" class="product-body-img-track">
        <div class="product-body-img-group"></div>
        <div class="product-body-img-group"></div>
        <div class="product-body-img-group"></div>
        <div class="product-body-img-group" id="product-gallery-main"></div>
        <div class="product-body-img-group"></div>
        <div class="product-body-img-group"></div>
        <div class="product-body-img-group"></div>
      </div>
    </div>

    <div id="product-dropdown-section" class="product-body-dropdown-section">
      <details class="product-body-dropdown">
        <summary class="product-body-dropdown-summary"><span>Detail</span><span class="product-body-dropdown-icon"></span></summary>
        <div class="product-body-dropdown-content">
          <div class="product-body-dropdown-content-inner">
            <p><!-- Oversized fit<br>Dropped shoulders<br>Heavyweight cotton jersey --></p>
          </div>
        </div>
      </details>

      <details class="product-body-dropdown">
        <summary class="product-body-dropdown-summary"><span>Size</span><span class="product-body-dropdown-icon"></span></summary>
        <div class="product-body-dropdown-content">
          <div class="product-body-dropdown-content-inner">
            <p><!-- One size<br>Width: 38 cm<br>Height: 42 cm<br>Handle drop: 28 cm --></p>
          </div>
        </div>
      </details>

      <details class="product-body-dropdown">
        <summary class="product-body-dropdown-summary"><span>Shipping</span><span class="product-body-dropdown-icon"></span></summary>
        <div class="product-body-dropdown-content">
          <div class="product-body-dropdown-content-inner">
            <p><!-- Ships within 3-7 business days<br>Tracking will be sent after dispatch --></p>
          </div>
        </div>
      </details>

      <details class="product-body-dropdown">
        <summary class="product-body-dropdown-summary"><span>Care</span><span class="product-body-dropdown-icon"></span></summary>
        <div class="product-body-dropdown-content">
          <div class="product-body-dropdown-content-inner">
            <p><!-- Spot clean only<br>Do not bleach<br>Dry flat away from direct sunlight --></p>
          </div>
        </div>
      </details>

      <details class="product-body-dropdown">
        <summary class="product-body-dropdown-summary"><span>Log</span><span class="product-body-dropdown-icon"></span></summary>
        <div class="product-body-dropdown-content">
          <div class="product-body-dropdown-content-inner">
            <p><!-- Designed by Yiichen de Lajii<br>Product record: Typography Flag Tee R.O.C. --></p>
          </div>
        </div>
      </details>
    </div>

    <div id="copyright-container" class="product-body-copyright-container"></div>
  </div>

  <script src="../../js/universal.js"></script>
  <script src="product.js"></script>
</body>
</html>
